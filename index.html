<!doctype html><html lang="ckb" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><meta name="theme-color" content="#111f32"/><title>ڕیزنووس — وەرگێڕی ژێرنووس</title><style>html,body{margin:0;min-height:100%;background:#111f32;color:#f8f4ed;font-family:Tahoma,Arial,sans-serif}#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}#boot img{width:90px;height:90px}#boot p{line-height:1.9;color:#ced8e4}#boot button{background:#e5aa5f;color:#15253a;border:0;border-radius:12px;padding:12px 24px;font:inherit;font-weight:bold}#boot-error{display:none}</style></head><body><div id="root"><div id="boot" role="status"><div><img src="/icon.png" alt=""/><h1>ڕیزنووس</h1><p id="boot-loading">بەرنامەکە ئامادە دەکرێت…</p><div id="boot-error"><p>بەرنامەکە بار نەبوو. دووبارە هەوڵ بدەرەوە؛ ئەگەر کێشەکە مایەوە، Android System WebView نوێ بکەرەوە.</p><button onclick="location.reload()">دووبارە هەوڵبدەوە</button></div></div></div></div><script>setTimeout(function(){var e=document.getElementById('boot-error'),l=document.getElementById('boot-loading');if(e){e.style.display='block';l.style.display='none'}},12000)</script><script type="module" src="/src/main.tsx"></script></body></html>
