name: Android signed APK
on:
  push:
    branches: ['arena/1a1ab4d2-subtitle-translate']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub-hosted Ubuntu runners already include the Android SDK.
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: Prepare signing key
        env:
          SIGNING_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$SIGNING_DATA" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo 'Signing secrets are not configured; refusing to publish an unsigned APK.' >&2
            exit 1
          fi
          echo "$SIGNING_DATA" | base64 --decode > "$RUNNER_TEMP/rizhnus-signing.p12"
          chmod 600 "$RUNNER_TEMP/rizhnus-signing.p12"
      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/rizhnus-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$APK"
      - name: Live Google batch smoke test
        run: node scripts/google-widget-smoke.mjs
      - name: Publish direct APK download
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-apk]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Rizhnus-2.0.apk
          gh release create "apk-${{ github.run_id }}" Rizhnus-2.0.apk --target "${{ github.sha }}" --title "Rizhnus 2.0 APK" --notes "Signed Android APK." --latest=false
      - uses: actions/upload-artifact@v4
        with:
          name: rizhnus-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Build emulator test packages
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest > "$RUNNER_TEMP/android-test-build.log" 2>&1 || {
            grep -iE "error:|failed|what went wrong|could not|exception|symbol|location:" "$RUNNER_TEMP/android-test-build.log" | tail -n 9 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - name: Remove key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/rizhnus-signing.p12"
  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rizhnus-signed-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: android-emulator-test
          path: test-apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install apk/app-release.apk
            adb shell am start -n com.rizhnus.subtitle/.MainActivity
            sleep 10
            adb shell pidof com.rizhnus.subtitle
            adb uninstall com.rizhnus.subtitle
            adb install test-apks/debug/app-debug.apk
            adb install test-apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.rizhnus.subtitle.BackgroundServiceTest,com.rizhnus.subtitle.UiLayoutTest com.rizhnus.subtitle.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -q 'OK (2 tests)' instrumentation.txt || (grep -E 'FAILURES|Failure|Error|Exception|Assertion|expected:|Tests run|INSTRUMENTATION_RESULT|Process crashed' instrumentation.txt | head -n 9 | sed 's/^/::error::/'; exit 1)
