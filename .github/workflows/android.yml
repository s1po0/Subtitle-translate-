name: Android signed APK
on:
  push:
    branches: ['arena/1a1ab4d2-subtitle-translate']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub-hosted Ubuntu runners already include the Android SDK.
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: Prepare signing key
        env:
          SIGNING_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$SIGNING_DATA" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo 'Signing secrets are not configured; refusing to publish an unsigned APK.' >&2
            exit 1
          fi
          echo "$SIGNING_DATA" | base64 --decode > "$RUNNER_TEMP/rizhnus-signing.p12"
          chmod 600 "$RUNNER_TEMP/rizhnus-signing.p12"
      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/rizhnus-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$APK"
      - name: Live Google batch smoke test
        run: node scripts/google-widget-smoke.mjs
      - name: Live multi-file benchmark
        continue-on-error: true
        run: node scripts/google-multifile-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rizhnus-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Generate synthetic audio test fixture
        if: ${{ !contains(github.event.head_commit.message, '[skip-emulator]') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p android/app/src/androidTest/assets
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:sample_rate=44100:duration=1800' -c:a aac -b:a 48k android/app/src/androidTest/assets/fixture.m4a
      - name: Build emulator test packages
        if: ${{ !contains(github.event.head_commit.message, '[skip-emulator]') }}
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest > "$RUNNER_TEMP/android-test-build.log" 2>&1 || {
            grep -iE "error:|failed|what went wrong|could not|exception|symbol|location:" "$RUNNER_TEMP/android-test-build.log" | tail -n 9 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: ${{ !contains(github.event.head_commit.message, '[skip-emulator]') }}
        with:
          name: android-emulator-test
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - name: Remove key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/rizhnus-signing.p12"
  emulator-smoke:
    needs: build
    if: ${{ !contains(github.event.head_commit.message, '[skip-emulator]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rizhnus-signed-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: android-emulator-test
          path: test-apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install apk/app-release.apk
            adb shell am start -n com.rizhnus.subtitle/.MainActivity
            sleep 10
            adb shell pidof com.rizhnus.subtitle
            adb uninstall com.rizhnus.subtitle
            adb install test-apks/debug/app-debug.apk
            adb install test-apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.rizhnus.subtitle.BackgroundServiceTest,com.rizhnus.subtitle.UiLayoutTest,com.rizhnus.subtitle.AudioChunksTest com.rizhnus.subtitle.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -q 'OK (6 tests)' instrumentation.txt || (adb logcat -d -s AndroidRuntime:E DEBUG:V libc:V chromium:E | tail -n 80 | sed 's/^/::error::/'; tail -n 80 instrumentation.txt | sed 's/^/::error::/'; exit 1)

  publish:
    needs: [build, emulator-smoke]
    if: ${{ always() && needs.build.result == 'success' && (needs.emulator-smoke.result == 'success' || (contains(github.event.head_commit.message, '[skip-emulator]') && needs.emulator-smoke.result == 'skipped')) && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-apk]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rizhnus-signed-apk
          path: apk
      - name: Publish signed direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/app-release.apk Rizhnus-3.0.apk
          gh release create "apk-${{ github.run_id }}" Rizhnus-3.0.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Rizhnus 3.0 APK" --notes "Signed Android APK. New mobile UI and app icon, local font and startup recovery screen. Video transcription remains experimental. Android emulator tests may be skipped for an explicitly marked release; see the workflow run for test results." --latest=false
